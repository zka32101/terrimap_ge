name: terrimap_ge
description: "State Master – Germany (仮)。16州の位置・州名・州都を覚える地図クイズ。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  terrimap_core:
    git:
      url: https://github.com/zka32101/terrimap_core
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - packs/de/pack.json
    - packs/de/regions.json
    - packs/de/geo.geojson
    - packs/de/strings/en.json
    - packs/de/strings/de.json
