name: terrimap_de
description: "State Master – Germany (仮)。16州の位置・州名・州都を覚える地図クイズ。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  flutter_riverpod: ^2.6.1
  url_launcher: ^6.3.0
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v3.11.0
  terrimap_core:
    git:
      url: https://github.com/zka32101/terrimap_core
      ref: main
  in_app_review: ^2.0.12
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  share_plus: ^10.1.4
  flutter_timezone: ^3.0.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: assets/icon/adaptive_bg.png
  adaptive_icon_foreground: assets/icon/adaptive_fg.png
  adaptive_icon_monochrome: assets/icon/adaptive_mono.png
  remove_alpha_ios: true
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - packs/de/pack.json
    - packs/de/regions.json
    - packs/de/geo.geojson
    - packs/de/profile.json
    - packs/de/facts.json
    - packs/de/story.json
    - packs/de/strings/en.json
    - packs/de/strings/zh.json
    - packs/de/strings/ko.json
    - packs/de/strings/tr.json
    - packs/de/strings/nl.json
    - packs/de/strings/pt.json
    - packs/de/strings/it.json
    - packs/de/strings/es.json
    - packs/de/strings/fr.json
    - packs/de/strings/ja.json
    - packs/de/strings/de.json
    - assets/art/backdrops/
    - assets/art/facilities/
    - assets/art/enemies/
    - assets/art/exclusive/
    - assets/art/bosses/
    - assets/art/weather/
    - assets/art/landmarks/
    - assets/sound/

# shared_preferences_android 2.5.0 は JNI(jni_flutter)を使い、リリースビルドで NoSuchMethodError
# (SharedPreferencesApiRegistrar.getAll) になり、起動直後に止まる(スプラッシュのまま)。
# 動作確認済みの 2.4.28 に固定する。
dependency_overrides:
  shared_preferences_android: 2.4.28
